name: Publish API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["DeficitSnatcher.Api/**", ".github/workflows/PublishApi.yml"]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            echo "Deploying Deficit Snatcher API..."

            # One-time setup on the server: git clone the repo to /opt/DeficitSnatcher.
            cd /opt/DeficitSnatcher
            flock /tmp/deficitsnatcher-deploy-git.lock -c "git fetch origin && git reset --hard ${{ github.sha }}"
            cd DeficitSnatcher.Api

            # Every API setting lives here - see DeficitSnatcher.Api/.env.example.
            cat > .env <<'ENVEOF'
            Logging__LogLevel__Default=Information
            Logging__LogLevel__Microsoft.AspNetCore=Warning
            Logging__LogLevel__Microsoft.EntityFrameworkCore=Warning

            POSTGRES_USER=${{ vars.POSTGRES_USER || 'deficitsnatcher' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'deficitsnatcher' }}

            Auth__Username=${{ vars.AUTH_USERNAME || 'owner' }}
            Auth__Password=${{ secrets.AUTH_PASSWORD }}
            Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}
            Secrets__Key=${{ secrets.SECRETS_KEY }}

            Cors__AllowedOrigins=${{ vars.WEB_URL }}
            RateLimiting__AuthPerMinute=10

            API_PORT=${{ vars.API_PORT }}
            DB_PORT=${{ vars.DB_PORT || '55433' }}
            ENVEOF
            # Compose reads $ in a .env value as a variable: quote values that have one (not POSTGRES_, see GymBook).
            sed -i -E '/^POSTGRES_/!{/^[A-Za-z_][A-Za-z0-9_.]*=.*[$]/{s/'\''/\\'\''/g;s/^([^=]+)=(.*)$/\1='\''\2'\''/}}' .env

            docker compose build --pull
            docker compose up -d --remove-orphans

            PORT=$(grep '^API_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null; then echo "API is up."; break; fi
              if [ "$i" = 30 ]; then echo "API did not become healthy:"; docker compose logs --tail 100 api; exit 1; fi
              sleep 2
            done
            flock /tmp/deficitsnatcher-docker-prune.lock docker image prune -f || true
            echo "Deployment complete!"

name: PC helper

# Builds the PC helper (DeficitSnatcher.Runner) for Windows, Mac and Linux, and puts the zips on the "pc-helper" release,
# where the site's Helpers tab links to. Each build is version 1.0.<run number>; version.txt (uploaded last, once the
# zips are there) is what installed helpers look at to update themselves.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["DeficitSnatcher.Runner/**", ".github/workflows/PcHelper.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: |
          set -e
          mkdir -p dist
          version=1.0.${{ github.run_number }}
          echo "$version" > version.txt
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            dotnet publish DeficitSnatcher.Runner/DeficitSnatcher.Runner.csproj -c Release -r $rid --self-contained -p:Version=$version -o out/$rid
            (cd out/$rid && zip -qr ../../dist/DeficitSnatcher-PC-helper-$rid.zip .)
          done
          ls -la dist
      # The Windows build, for the installer job (Inno Setup needs Windows; building it again there needs the .NET SDK there).
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: out/win-x64
          # .playwright (the driver the helper runs Chrome with) starts with a dot: left out unless asked.
          include-hidden-files: true
      - name: Publish to the pc-helper release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pc-helper >/dev/null 2>&1 || gh release create pc-helper --title "PC helper" --latest=false \
            --notes "The PC helper for stores that block servers (Walmart). Download the zip for your computer, unzip, open DeficitSnatcher.Runner and paste a setup code from the site's Helpers tab."
          gh release upload pc-helper dist/*.zip --clobber
          gh release upload pc-helper version.txt --clobber

  # The Windows installer (DeficitSnatcher-PC-helper-Setup.exe: Start menu entry, listed in Settings -> Apps), with Inno
  # Setup on a Windows runner.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: out/win-x64
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.build.outputs.version }}'
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=$version" "/DSourceDir=$PWD\out\win-x64" DeficitSnatcher.Runner/installer/DeficitSnatcher.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish to the pc-helper release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload pc-helper DeficitSnatcher.Runner/installer/DeficitSnatcher-PC-helper-Setup.exe --clobber


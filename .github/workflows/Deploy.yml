name: Deploy

# Runs from the site's Deploy tab (or Actions → Deploy → Run workflow). Builds and restarts everything on the server
# with docker compose: the database, the API, Camoufox (the app's browser) and the site.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the web app and API
        required: false
        type: boolean
        default: true
      build_android:
        description: Build and publish the Android app
        required: false
        type: boolean
        default: false
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e

            # The first deploy clones the repository; later ones move it to this commit.
            DIR=/opt/DeficitSnatcher
            if [ ! -d "$DIR/.git" ]; then
              git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DIR"
            fi
            cd "$DIR"
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            # Always the newest main, even when this is a re-run of an older run (a re-run keeps its old commit).
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            SHA=$(git rev-parse HEAD)
            echo "Deploying Deficit Snatcher $SHA: $(git log -1 --format=%s)"

            # Every setting - see .env.example. The one login is APP_USERNAME / APP_PASSWORD.
            echo "Writing .env..."
            cat > .env <<'ENVEOF'
            Auth__Username=${{ secrets.APP_USERNAME || vars.APP_USERNAME }}
            Auth__Password=${{ secrets.APP_PASSWORD }}
            Auth__TokenDays=${{ vars.TOKEN_DAYS || '14' }}
            Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}
            Secrets__Key=${{ secrets.SECRETS_KEY }}

            POSTGRES_USER=${{ vars.POSTGRES_USER || 'deficitsnatcher' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'deficitsnatcher' }}

            App__PublicUrl=${{ vars.PUBLIC_URL }}
            WEB_PORT=${{ vars.WEB_PORT || '8090' }}

            OpenAI__ApiKey=${{ secrets.OPENAI_API_KEY }}

            Deploy__GitHubToken=${{ secrets.DEPLOY_GITHUB_TOKEN }}
            Deploy__Repository=${{ github.repository }}
            Deploy__Workflow=Deploy.yml
            Deploy__Branch=main

            Logging__LogLevel__Default=Information
            Logging__LogLevel__Microsoft.AspNetCore=Warning
            Logging__LogLevel__Microsoft.EntityFrameworkCore=Warning
            RateLimiting__AuthPerMinute=5
            ENVEOF
            echo "GIT_SHA=$SHA" >> .env
            echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .env
            chmod 600 .env

            # Compose reads $ in a .env value as a variable: values with one are single-quoted so they arrive as they
            # are. Not POSTGRES_: the database was made with whatever the password came out as.
            sed -i -E '/^POSTGRES_/!{/^[A-Za-z_][A-Za-z0-9_.]*=.*[$]/{s/'\''/\\'\''/g;s/^([^=]+)=(.*)$/\1='\''\2'\''/}}' .env

            for name in Auth__Username Auth__Password Jwt__SigningKey POSTGRES_PASSWORD; do
              if ! grep -qE "^$name=.+" .env; then echo "::error::$name is empty: set its GitHub secret."; exit 1; fi
            done

            echo "Building..."
            docker compose build --pull
            echo "Restarting..."
            docker compose up -d --remove-orphans

            echo "Waiting for the site and the API..."
            PORT=$(grep '^WEB_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$PORT/api/health" > /dev/null; then echo "Up."; break; fi
              if [ "$i" = 90 ]; then
                echo "::error::Not healthy after 3 minutes. Containers and recent logs:"
                docker compose ps -a
                echo "----- db -----"
                docker compose logs --tail 80 db
                echo "----- api -----"
                docker compose logs --tail 60 api
                echo "----- web -----"
                docker compose logs --tail 20 web
                echo "----- camoufox -----"
                docker compose logs --tail 20 camoufox
                exit 1
              fi
              sleep 2
            done

            docker image prune -f || echo "Couldn't remove old images; skipped."
            echo "Deployed $SHA."

  android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the APK
        run: |
          set -e
          dotnet workload install maui-android
          cd DeficitSnatcher.Android
          dotnet build -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
          dotnet publish -f net11.0-android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:ApplicationVersion=${{ github.run_number }}
          mkdir -p ../dist
          cp bin/Release/net11.0-android/publish/ca.deficitsnatcher.app-Signed.apk ../dist/DeficitSnatcher.apk
          echo "${{ github.run_number }}" > ../dist/version.txt
          ls -la ../dist
      - name: Publish to the android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android app" --latest=false \
            --notes "The Android app: download DeficitSnatcher.apk on the phone and open it (allow installing from your browser). It updates itself after that."
          gh release upload android dist/DeficitSnatcher.apk --clobber
          gh release upload android dist/version.txt --clobber

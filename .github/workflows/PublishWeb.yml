name: Publish Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["DeficitSnatcher.Web/**", ".github/workflows/PublishWeb.yml"]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            echo "Deploying Deficit Snatcher web..."
            cd /opt/DeficitSnatcher
            flock /tmp/deficitsnatcher-deploy-git.lock -c "git fetch origin && git reset --hard ${{ github.sha }}"
            cd DeficitSnatcher.Web

            # The API's address is baked into the page at build time; the API only answers this site if WEB_URL is
            # its address (PublishApi turns it into Cors__AllowedOrigins).
            cat > .env <<'ENVEOF'
            WEB_PORT=${{ vars.WEB_PORT }}
            NEXT_PUBLIC_API_URL=${{ vars.API_BASE_URL }}
            ENVEOF

            docker compose build --pull
            docker compose up -d --remove-orphans

            PORT=$(grep '^WEB_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null; then echo "Web is up."; break; fi
              if [ "$i" = 30 ]; then echo "Web did not respond:"; docker compose logs --tail 100 web; exit 1; fi
              sleep 2
            done
            flock /tmp/deficitsnatcher-docker-prune.lock docker image prune -f || true
            echo "Deployment complete!"

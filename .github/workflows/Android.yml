name: Android app

# Builds the Android app (DeficitSnatcher.Android) into DeficitSnatcher.apk and puts it on the "android" release, where the
# site's Settings links to it and installed apps update themselves from. Each build's version is the run number;
# version.txt (uploaded last, once the APK is there) is what the app compares with its own.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["DeficitSnatcher.Android/**", ".github/workflows/Android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the APK
        run: |
          set -e
          dotnet workload install maui-android
          cd DeficitSnatcher.Android
          # The Android SDK pieces this .NET version builds against (platform, build tools), if the runner lacks them.
          dotnet build -t:InstallAndroidDependencies -f net11.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
          dotnet publish -f net11.0-android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:ApplicationVersion=${{ github.run_number }}
          mkdir -p ../dist
          cp bin/Release/net11.0-android/publish/ca.deficitsnatcher.app-Signed.apk ../dist/DeficitSnatcher.apk
          echo "${{ github.run_number }}" > ../dist/version.txt
          ls -la ../dist
      - name: Publish to the android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android app" --latest=false \
            --notes "The Android app: download DeficitSnatcher.apk on the phone and open it (allow installing from your browser). It updates itself after that."
          gh release upload android dist/DeficitSnatcher.apk --clobber
          gh release upload android dist/version.txt --clobber

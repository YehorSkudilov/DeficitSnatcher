# The site: the static pages, and /api passed through to the API container, so the browser talks to one origin.
# Plain HTTP; the server's reverse proxy terminates TLS in front of it.
# WebSockets (the PC helper's connection) pass through /api too.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, so a restarted API container (new address) is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Check all / Test can take a while: slow sites, or waiting up to 2 minutes for you to do a store's human check.
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    # The one page is /index.html (screens are picked by the #part); anything else is a 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The site itself is up (the API's is /api/health).
    location = /health {
        access_log off;
        return 200 "ok";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
